<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Barber 2 Day — Speed Snip</title><style>:root{--sky:#70d1fe;--yellow:#ffd90f;--pink:#ff69b4;--border:4px solid #000}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--sky);font-family:"Comic Sans MS","Chalkboard SE",sans-serif;touch-action:manipulation;overflow:hidden}#game{width:min(95vw,400px);background:#fff;border:var(--border);border-radius:20px;box-shadow:8px 8px #000c;overflow:hidden;text-align:center}header{padding:10px;background:var(--pink);border-bottom:var(--border)}h1{margin:0;color:#fff;font-size:24px;text-transform:uppercase;text-shadow:2px 2px #000;letter-spacing:2px}.hud{display:flex;justify-content:space-between;padding:10px 20px;background:var(--yellow);border-bottom:var(--border);font-size:19px;font-weight:bold}#area{height:400px;position:relative;display:flex;align-items:flex-end;justify-content:center;background:#e8e8e8}.head{position:relative;width:200px;height:250px;background:var(--yellow);border:var(--border);border-bottom:0;border-radius:100px 100px 0 0}.eye{position:absolute;top:50px;width:40px;height:40px;display:grid;place-items:center;background:#fff;border:var(--border);border-radius:50%}.eye:after{content:"";width:8px;height:8px;border-radius:50%;background:#000}.left{left:45px}.right{right:45px}.hair{position:absolute;z-index:4;font-size:45px;user-select:none;cursor:pointer;animation:pop .2s ease-out}.hair:active{transform:scale(.8)}@keyframes pop{from{transform:scale(0)}to{transform:scale(1.2)}}#overlay{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#70d1fee6}.message{padding:0 20px;margin-bottom:18px;color:#fff;font-size:24px;font-weight:bold;text-shadow:2px 2px #000}.btn{margin:10px;padding:15px 25px;border:var(--border);border-radius:10px;background:var(--pink);color:#fff;box-shadow:4px 4px #000;font:700 20px inherit;text-shadow:2px 2px #000;cursor:pointer}.btn:active{transform:translate(4px,4px);box-shadow:none}.back{position:fixed;top:16px;left:16px;padding:8px 12px;border:3px solid #000;border-radius:8px;background:#fff;color:#000;font-weight:bold;text-decoration:none}@media(max-height:570px){#area{height:330px}}</style></head><body><a class="back" href="/">← Retour au salon</a><main id="game"><header><h1>Barber 2 Day</h1></header><div class="hud"><span id="time">Temps : 15</span><span id="score">Score : 0</span></div><div id="area"><div class="head" id="head"><i class="eye left"></i><i class="eye right"></i></div><div id="overlay"><div class="message" id="message">Qui est le meilleur coiffeur ?</div><button class="btn" id="play">Joueur 1 : C'EST PARTI !</button></div></div></main><script>const scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),head=document.querySelector('#head'),overlay=document.querySelector('#overlay'),message=document.querySelector('#message'),play=document.querySelector('#play');let score=0,time=15,player=1,p1=0,timer,spawner;const styles=['🦱','💈','✂️','🧔','〰️'];function start(){clearInterval(timer);clearInterval(spawner);score=0;time=15;scoreEl.textContent='Score : 0';timeEl.textContent='Temps : 15';overlay.style.display='none';document.querySelectorAll('.hair').forEach(x=>x.remove());timer=setInterval(()=>{timeEl.textContent='Temps : '+--time;if(time<=0)finish()},1000);spawner=setInterval(spawn,400)}function spawn(){const hair=document.createElement('button');hair.className='hair';hair.type='button';hair.textContent=styles[Math.floor(Math.random()*styles.length)];hair.style.left=(Math.random()*240-20)+'px';hair.style.top=(Math.random()*180-40)+'px';const cut=e=>{e.preventDefault();if(!hair.isConnected)return;navigator.vibrate?.(30);score+=10;scoreEl.textContent='Score : '+score;hair.remove();head.style.background='#fff';setTimeout(()=>head.style.background='var(--yellow)',50)};hair.addEventListener('pointerdown',cut);head.append(hair);setTimeout(()=>hair.remove(),1200)}function finish(){clearInterval(timer);clearInterval(spawner);document.querySelectorAll('.hair').forEach(x=>x.style.pointerEvents='none');overlay.style.display='flex';if(player===1){p1=score;message.innerHTML='Temps écoulé !<br>Score J1 : '+p1+'<br><br>Passe le téléphone au Joueur 2 !';play.textContent="Joueur 2 : C'EST PARTI !";player=2}else{const winner=p1>score?'Victoire du Joueur 1 ! 🏆':score>p1?'Victoire du Joueur 2 ! 🏆':'Égalité parfaite ! 🤝';message.innerHTML='J1 : '+p1+' pts | J2 : '+score+' pts<br><br><span style="color:var(--yellow);font-size:26px">'+winner+'</span>';play.textContent='Revanche !';player=1}}play.addEventListener('pointerdown',e=>{e.preventDefault();start()});</script></body></html>
